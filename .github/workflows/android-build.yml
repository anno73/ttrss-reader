
name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ttrss-skill:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test tt-rss skill with Windows PowerShell 5.1
        shell: powershell
        run: .\.github\skills\ttrss-backend\tests\Test-TtrssClient.ps1

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Define build version
        env:
          SOURCE_BRANCH: ${{ github.head_ref || (github.ref_type == 'branch' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_BRANCH" ]]; then
            echo "::error::Cannot identify source branch."
            exit 1
          fi
          timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          normalized=$(printf '%s' "$SOURCE_BRANCH" | LC_ALL=C.UTF-8 sed 's/[^A-Za-z0-9._-]/_/g')
          version_name="${normalized}_$(date -u -d "$timestamp" +'%Y-%m-%d_%H-%M-%S')"
          version_code=$(( $(date -u -d "$timestamp" +%s) - 1577836800 ))
          if (( version_code <= 1982 || version_code > 2100000000 )); then
            echo "::error::Build version code is outside the supported range: $version_code"
            exit 1
          fi
          echo "APP_BUILD_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          echo "APP_BUILD_TIMESTAMP=$timestamp" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Build version: $version_name ($version_code)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''
          
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
        
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore persistent debug signing key
        id: signing
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/ttrss-android"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::notice::ANDROID_DEBUG_KEYSTORE_BASE64 is missing; tests will run, but APK build and upload are skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          mkdir -p "$ANDROID_USER_HOME"
          keystore="$ANDROID_USER_HOME/debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # A certificate request verifies private-key access, not just the certificate.
          keytool -certreq -keystore "$keystore" -storepass android \
            -alias androiddebugkey -keypass android > /dev/null
          fingerprint=$(keytool -exportcert -keystore "$keystore" -storepass android \
            -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          echo "sha256=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Test version generation, timeout diagnostics and media saving
        env:
          ORG_GRADLE_PROJECT_localePluginMavenUser: ${{ secrets.LOCALE_PLUGIN_MAVEN_USER }}
          ORG_GRADLE_PROJECT_localePluginMavenPassword: ${{ secrets.LOCALE_PLUGIN_MAVEN_PASSWORD }}
        run: ./gradlew --no-daemon :ttrssreader:verifyBuildVersion :ttrssreader:testFdroidDebugUnitTest --tests 'org.ttrssreader.net.*Test' --tests 'org.ttrssreader.utils.MediaSaveFolderTest'

      - name: Build debug APK
        if: steps.signing.outputs.available == 'true'
        env:
          ORG_GRADLE_PROJECT_localePluginMavenUser: ${{ secrets.LOCALE_PLUGIN_MAVEN_USER }}
          ORG_GRADLE_PROJECT_localePluginMavenPassword: ${{ secrets.LOCALE_PLUGIN_MAVEN_PASSWORD }}
        run: ./gradlew --no-daemon :ttrssreader:signingReport assembleDebug

      - name: Verify APK version, package and provider identity
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          for flavor in fdroid play; do
            apk="ttrssreader/build/outputs/apk/$flavor/debug/ttrssreader-$flavor-debug.apk"
            badging=$("$aapt2" dump badging "$apk")
            actual_name=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$badging")
            actual_code=$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<< "$badging")
            if [[ "$actual_name" != "$EXPECTED_VERSION_NAME" || "$actual_code" != "$EXPECTED_VERSION_CODE" ]]; then
              echo "::error::Unexpected version in $apk: $actual_name ($actual_code)"
              exit 1
            fi
            echo "$flavor APK version verified: $actual_name ($actual_code)"
            if ! grep -q "^package: name='org\.ttrssreader\.anno73' " <<< "$badging"; then
              echo "::error::Unexpected package ID in $apk"
              exit 1
            fi
            manifest=$("$aapt2" dump xmltree "$apk" --file AndroidManifest.xml)
            grep -A 6 'E: provider' <<< "$manifest"
            if grep -Eq 'android:authorities[^=]*="org\.ttrssreader"' <<< "$manifest" ||
                grep -Fq '${applicationId}' <<< "$manifest"; then
              echo "::error::Legacy authority or unresolved application ID in $apk"
              exit 1
            fi
            if ! awk '
              function check_provider() {
                if (provider && name) {
                  count++
                  if (!authority) invalid = 1
                }
              }
              /E: / {
                check_provider()
                provider = ($0 ~ /E: provider([ (]|$)/)
                name = 0
                authority = 0
              }
              provider && /A: (android|http:\/\/schemas.android.com\/apk\/res\/android):name/ {
                name = ($0 ~ /="org\.ttrssreader\.model\.ListContentProvider"/)
              }
              provider && /A: (android|http:\/\/schemas.android.com\/apk\/res\/android):authorities/ {
                authority = ($0 ~ /="org\.ttrssreader\.anno73\.listprovider"/)
              }
              END {
                check_provider()
                if (count != 1 || invalid) exit 1
              }
            ' <<< "$manifest"; then
              echo "::error::Missing or incorrect list-provider declaration in $apk"
              exit 1
            fi
            echo "$flavor APK package and list-provider authority verified"
          done

      - name: Verify APK signing identity
        if: steps.signing.outputs.available == 'true'
        env:
          EXPECTED_SIGNER_SHA256: ${{ steps.signing.outputs.sha256 }}
        run: |
          set -euo pipefail
          for flavor in fdroid play; do
            apk="ttrssreader/build/outputs/apk/$flavor/debug/ttrssreader-$flavor-debug.apk"
            verification=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
            printf '%s\n' "$verification"
            mapfile -t signers < <(printf '%s\n' "$verification" | sed -n \
              's/^Signer #[0-9]* certificate SHA-256 digest: //p')
            if [[ ${#signers[@]} -ne 1 || "${signers[0],,}" != "$EXPECTED_SIGNER_SHA256" ]]; then
              echo "::error::Unexpected signer for $apk; refusing to publish."
              exit 1
            fi
            echo "$flavor APK verified: $EXPECTED_SIGNER_SHA256"
          done

      - name: Upload APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ttrss-reader-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ttrss-android/debug.keystore"
